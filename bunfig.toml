[test]
pathIgnorePatterns = ["fixtures/**", "fixture/**"]
coverage = false
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["src/test-setup.ts"]
concurrentTestGlob = "**/*.test.ts"
onlyFailures = true
preload = ["./src/__tests__/test-setup.ts"]

[install]
linker = "hoisted"

[run]
bun = true
